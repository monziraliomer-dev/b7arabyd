function openM(h){$("#modal").innerHTML=h;$("#mask").classList.add("on")}
function closeM(){$("#mask").classList.remove("on")}
$("#mask").addEventListener("click",e=>{if(e.target.id==="mask")closeM()});
function order(id){const p=D.p.find(x=>x.id===id);
 openM(`<h3>طلب: ${esc(p.n)}</h3>
 <label>الاسم *</label><input id="o1"><label>رقم التلفون *</label><input id="o2" type="tel" dir="ltr"><label>رقم احتياطي (اختياري)</label><input id="o3" type="tel" dir="ltr">
 <label>المدينة أو المنطقة *</label><input id="o4"><label>العنوان *</label><input id="o5"><label>عدد الطلب *</label><input id="o6" type="number" min="1" value="1" oninput="tot(${id})">
 <p id="ot" style="color:var(--y);font-weight:800;margin-bottom:10px">الإجمالي: ${fm(p.pr)} ${esc(D.s.cur)}</p>
 <button class="btn" style="width:100%" onclick="send(${id})">إرسال الطلب عبر واتساب</button>
 <button class="btn o" style="width:100%;margin-top:8px" onclick="closeM()">إلغاء</button>`)}
function tot(id){const p=D.p.find(x=>x.id===id);$("#ot").textContent="الإجمالي: "+fm(p.pr*(+$("#o6").value||1))+" "+D.s.cur}
function send(id){const p=D.p.find(x=>x.id===id),v=i=>$("#o"+i).value.trim();
 if(!v(1)||!v(2)||!v(4)||!v(5)||!(+v(6)>0)){alert("من فضلك أكمل الحقول المطلوبة");return}
 if(v(2).replace(/\D/g,"").length<8){alert("رقم التلفون غير صحيح");return}
 const code="BA-"+Math.floor(1000+Math.random()*9000),q=+v(6);
 const msg=`🛒 *طلب جديد — ${D.s.name}*\nرقم الطلب: ${code}\nالمنتج: ${p.n}\nالعدد: ${q}\nالإجمالي: ${fm(p.pr*q)} ${D.s.cur}\n\nالاسم: ${v(1)}\nالهاتف: ${v(2)}\nرقم احتياطي: ${v(3)||"—"}\nالمدينة/المنطقة: ${v(4)}\nالعنوان: ${v(5)}`;
 const my=LS("bh_my")||[];my.push({c:code,p:p.n,t:Date.now()});LS("bh_my",my);
 window.open(`https://wa.me/${D.s.owner}?text=${encodeURIComponent(msg)}`,"_blank");
 openM(`<h3>✅ تم تجهيز طلبك</h3><p>رقم طلبك: <b style="color:var(--y);font-size:20px">${code}</b></p><p style="color:var(--m);margin:8px 0 14px">اضغط «إرسال» داخل الواتساب لإتمام الطلب. بعد استلامه ستصلك رسالة تأكيد ورابط تتبع.</p><button class="btn" style="width:100%" onclick="closeM()">حسناً</button>`)}

/* ================= التتبع (بدون سيرفر: الحالة داخل الرابط) ================= */
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s))));
function tl(s){s=Math.max(0,Math.min(4,+s||0));return`<div class="tl">${ST.map((x,i)=>`<div class="${i<=s?"d":""}">${i<=s?"✔":"○"} ${x}</div>`).join("")}</div>`}
function showTrack(h){try{const o=dec(h);$("#tr").innerHTML=`<h3 style="color:var(--y)">طلب ${esc(o.c)} — ${esc(o.n)}</h3><p style="color:var(--m)">${esc(o.p||"")}</p>${tl(o.s)}`;$("#track").scrollIntoView()}catch(e){$("#tr").textContent="رابط التتبع غير صالح"}}
function trackCode(){const c=$("#tc").value.trim().toUpperCase(),m=(LS("bh_my")||[]).find(x=>x.c===c);
 $("#tr").innerHTML=m?`<h3 style="color:var(--y)">طلب ${esc(c)}</h3>${tl(0)}<p style="color:var(--m)">بانتظار تأكيد الاستلام من الإدارة، وسيصلك رابط التتبع على الواتساب.</p>`:`<p style="color:var(--m)">لم نجد الطلب على هذا الجهاز. استخدم رابط التتبع المرسل إليك على الواتساب.</p>`}

/* ================= لوحة الأدمن ================= */
function renderAdmin(){
 const T=[["p","المنتجات"],["o","الطلبات والتأكيد"],["s","إعدادات الموقع"],["b","نسخ احتياطي ونشر"]];
 $("#app").innerHTML=`<div class="wrap adm"><h2 style="color:var(--y)">⚙️ لوحة التحكم</h2>
 <div class="tabs">${T.map(([k,l])=>`<button class="btn ${tab===k?"":"o"}" onclick="tab='${k}';renderAdmin()">${l}</button>`).join("")}<a class="btn o" href="#" onclick="location.hash='';return false">← عرض المتجر</a></div><div id="ab"></div></div>`;
 ({p:aP,o:aO,s:aS,b:aB})[tab]();
}
function aP(){$("#ab").innerHTML=D.p.map(p=>`<div class="row"><span><b>${esc(p.n)}</b><br><small style="color:var(--m)">${fm(p.pr)} / ${fm(p.o)}</small></span><button class="btn" onclick="editP(${p.id})">تعديل</button><button class="btn r" onclick="delP(${p.id})">حذف</button></div>`).join("")+`<button class="btn" onclick="editP(0)">+ إضافة منتج</button>`}
function delP(id){if(confirm("حذف المنتج؟")){D.p=D.p.filter(x=>x.id!==id);save();renderAdmin()}}
let img="";
function editP(id){const p=D.p.find(x=>x.id===id)||{n:"",e:"🛍️",d:"",o:"",pr:"",img:""};img=p.img||"";
 openM(`<h3>${id?"تعديل":"إضافة"} منتج</h3><label>الاسم</label><input id="e1" value="${esc(p.n)}"><label>أيقونة (إيموجي بديلة للصورة)</label><input id="e2" value="${esc(p.e)}">
 <label>الوصف</label><textarea id="e3" rows="4">${esc(p.d)}</textarea><div class="g2"><div><label>السعر قبل الخصم</label><input id="e4" type="number" value="${p.o}"></div><div><label>السعر بعد الخصم</label><input id="e5" type="number" value="${p.pr}"></div></div>
 <label>صورة المنتج (رفع من الجهاز)</label><input type="file" accept="image/*" onchange="upl(this)"><label>أو رابط صورة</label><input id="e6" dir="ltr" value="${esc(p.img&&p.img.startsWith("http")?p.img:"")}">
 <button class="btn" style="width:100%" onclick="saveP(${id})">حفظ</button>`)}
function upl(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,700/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",.78)};im.src=r.result};r.readAsDataURL(f)}
function saveP(id){const g=i=>$("#e"+i).value.trim(),o={id:id||Date.now(),n:g(1),e:g(2),d:g(3),o:+g(4),pr:+g(5),img:g(6)||img};
 if(!o.n||!o.pr){alert("الاسم والسعر مطلوبان");return}
 id?D.p[D.p.findIndex(x=>x.id===id)]=o:D.p.push(o);save();closeM();renderAdmin()}

function aO(){const L=LS("bh_orders")||[];
 $("#ab").innerHTML=`<p style="color:var(--m);margin-bottom:10px">عند وصول طلب في واتساب، سجّله هنا ثم اضغط إرسال: تصل العميل رسالة تأكيد برابط تتبع. غيّر الحالة وأرسل مرة أخرى لتحديثه.</p>
 <div class="g2"><div><label>رقم الطلب</label><input id="a1" placeholder="BA-1234" dir="ltr"></div><div><label>اسم العميل</label><input id="a2"></div><div><label>هاتف العميل</label><input id="a3" dir="ltr"></div><div><label>المنتج</label><input id="a4"></div></div>
 <button class="btn" onclick="addO()">+ تسجيل الطلب</button><hr style="border-color:var(--line);margin:16px 0">
 ${L.map((o,i)=>`<div class="row"><span><b>${esc(o.c)}</b> — ${esc(o.n)}<br><small style="color:var(--m)">${esc(o.p)} · ${esc(o.ph)}</small></span>
 <select style="width:auto;margin:0" onchange="stO(${i},this.value)">${ST.map((x,k)=>`<option value="${k}" ${o.s==k?"selected":""}>${x}</option>`).join("")}</select>
 <button class="btn" onclick="waO(${i})">إرسال للعميل 📲</button><button class="btn r" onclick="dlO(${i})">✕</button></div>`).join("")||"<p style='color:var(--m)'>لا توجد طلبات مسجلة.</p>"}`}
function addO(){const g=i=>$("#a"+i).value.trim();if(!g(1)||!g(3)){alert("رقم الطلب والهاتف مطلوبان");return}const L=LS("bh_orders")||[];L.unshift({c:g(1).toUpperCase(),n:g(2),ph:g(3),p:g(4),s:0});LS("bh_orders",L);aO()}
function stO(i,v){const L=LS("bh_orders");L[i].s=+v;LS("bh_orders",L)}
function dlO(i){const L=LS("bh_orders");L.splice(i,1);LS("bh_orders",L);aO()}
function waO(i){const o=(LS("bh_orders"))[i],u=location.href.split("#")[0]+"#track="+enc({c:o.c,n:o.n,p:o.p,s:o.s});
 const m=`مرحباً ${o.n} 👋\nتم استلام طلبك رقم *${o.c}* بنجاح ✅\nالحالة الحالية: *${ST[o.s]}*\nتتبع طلبك من هنا:\n${u}\n\nشكراً لتسوقك من ${D.s.name}`;
 window.open(`https://wa.me/${phoneIntl(o.ph)}?text=${encodeURIComponent(m)}`,"_blank")}

function aS(){
 const s=D.s;
 const F=[
  ["name","اسم الموقع"],["en","الاسم الإنجليزي"],
  ["owner","رقم واتساب الطلبات الدولي (أرقام فقط مع مفتاح الدولة)"],
  ["phone","رقم هاتف إضافي (اختياري)"],["cc","مفتاح الدولة الافتراضي"],
  ["fb","رابط فيسبوك"],["instagram","رابط إنستغرام"],
  ["tiktok","رابط تيك توك"],["youtube","رابط يوتيوب"],
  ["cur","العملة"],["bar","شريط الإعلان"],["h1","عنوان الواجهة"],
  ["sub","وصف الواجهة"],["about","من نحن"]
 ];
 $("#ab").innerHTML=F.map(([k,l])=>`<label>${l}</label><input id="s_${k}" value="${esc(s[k]||"")}" ${["fb","instagram","tiktok","youtube"].includes(k)?'dir="ltr"':''}>`).join("")
 +`<label>نهاية العرض (عدّاد التخفيضات)</label><input id="s_end" type="datetime-local" value="${new Date(s.end-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}">
 <p style="color:var(--m);font-size:13px;margin:8px 0">لحفظ الإعدادات للجميع، أدخل رمز ADMIN_TOKEN الذي أعددته في أسرار Cloudflare. لا تضع الرمز داخل ملفات الموقع.</p>
 <button class="btn" onclick="saveS()">حفظ الإعدادات في قاعدة البيانات</button>`;
}
async function saveS(){
 const keys=["name","en","owner","phone","cc","fb","instagram","tiktok","youtube","cur","bar","h1","sub","about"];
 const next={...D.s};
 keys.forEach(k=>next[k]=$("#s_"+k).value.trim());
 next.end=new Date($("#s_end").value).getTime()||D.s.end;
 const token=prompt("أدخل رمز إدارة API (ADMIN_TOKEN) لحفظ الإعدادات:");
 if(!token)return;
 const serverSettings={...next};delete serverSettings.pass;
 try{
  const response=await fetch(API_SETTINGS,{
   method:"PUT",
   headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},
   body:JSON.stringify({settings:serverSettings})
  });
  const payload=await response.json();
  if(!response.ok||!payload.success){
   alert(payload.error||"تعذر حفظ الإعدادات. تحقق من رمز الإدارة وربط قاعدة البيانات.");
   return;
  }
  D.s=next;save();alert("تم حفظ الإعدادات في قاعدة البيانات بنجاح ✅");
  renderShop();
 }catch(e){
  alert("تعذر الاتصال بواجهة API. تحقق من نشر Worker وإعداد CORS.");
 }
}

function aB(){$("#ab").innerHTML=`<div class="about" style="text-align:right"><h3 style="color:var(--y)">كيف تنشر تعديلاتك للجميع؟</h3><p style="color:#555">إعدادات التواصل تُحفظ في قاعدة البيانات عبر واجهة API. أما إدارة المنتجات والطلبات في هذه النسخة فما زالت محلية في المتصفح؛ سنربطها بقاعدة البيانات في مرحلة لاحقة. يمكنك تصدير نسخة احتياطية من الإعدادات المحلية عند الحاجة.</p><br>
 <button class="btn" onclick="exp()">⬇ تصدير data.json</button> <label class="btn o" style="margin:0">استيراد ملف<input type="file" accept=".json" hidden onchange="imp(this)"></label> <button class="btn r" onclick="if(confirm('إعادة كل شيء للإعدادات الأصلية؟')){localStorage.removeItem('bh_data');location.reload()}">إعادة الضبط</button></div>`}
function exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"application/json"}));a.download="data.json";a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{D=JSON.parse(r.result);save();alert("تم الاستيراد ✅");renderAdmin()}catch(e){alert("ملف غير صالح")}};r.readAsText(i.files[0])}

init();
</script>
</body>
</html>
