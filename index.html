<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f0f0f"><title>بحر أبيض للتسوق | Market B7rabyd</title>
<meta name="description" content="بحر أبيض للتسوق — سيارات ومولدات وأحذية وملابس ومنتجات متنوعة">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf9f4;--card:#fff;--line:#ece6d6;--gold:#f5b800;--gold-dark:#8f6200;--ink:#111;--muted:#626262;--green:#168044;--red:#bd2c2c}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}a{color:inherit;text-decoration:none}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:0 16px}
.topbar{background:var(--gold);padding:7px 12px;text-align:center;font-weight:800;font-size:14px}
header{position:sticky;top:0;z-index:10;background:#0f0f0f;color:#fff;border-bottom:3px solid var(--gold)}header .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{display:flex;gap:10px;align-items:center}.logo-icon{background:var(--gold);color:#111;border-radius:12px;padding:3px 10px;font-size:24px}.logo b{display:block;color:var(--gold);font-size:20px}.logo small{display:block;color:#bbb;font-size:11px;direction:ltr}
nav{display:flex;gap:16px;align-items:center;font-weight:700}nav a:hover{color:var(--gold)}.actions{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--gold);color:#111;font-weight:800;display:inline-block}.btn.dark{background:#111;color:var(--gold)}.btn.outline{background:transparent;border:1px solid var(--gold-dark);color:var(--gold-dark)}.btn.red{background:var(--red);color:white}.btn.small{padding:6px 10px;font-size:13px}
.hero{padding:58px 0 48px;background:radial-gradient(circle at 85% 0,#ffe7a0 0,transparent 42%),radial-gradient(circle at 8% 100%,#fff0bd 0,transparent 38%),#fffdf7;border-bottom:1px solid var(--line);text-align:center}.pill{display:inline-block;background:#111;color:var(--gold);padding:4px 16px;border-radius:30px;font-weight:800}.hero h1{font-size:clamp(28px,5vw,50px);line-height:1.35;margin:14px 0}.hero p{max-width:720px;margin:0 auto 22px;color:#444;font-size:17px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px auto}.trust div{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:13px;text-align:center;font-weight:700}
.section{padding:28px 0}.section h2{text-align:center;font-size:28px;margin:12px 0 22px}.section h2 span{color:var(--gold-dark)}.categories{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:22px}.category-btn{border:1px solid var(--line);background:#fff;border-radius:24px;padding:7px 15px;font-weight:700}.category-btn.active,.category-btn:hover{background:#111;color:var(--gold);border-color:#111}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #0000000b}.product-img{height:220px;background:linear-gradient(135deg,#fff6d6,#efe8d2);display:flex;align-items:center;justify-content:center;font-size:70px;overflow:hidden;cursor:pointer}.product-img img{width:100%;height:100%;object-fit:cover}.card-body{padding:15px;display:flex;flex-direction:column;gap:7px;flex:1}.card h3{margin:0;font-size:19px}.muted{color:var(--muted)}.price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.price strong{font-size:21px;color:var(--gold-dark)}.price s{color:#777;font-size:14px}.card-actions{display:flex;gap:8px;margin-top:8px}.card-actions button{flex:1}
.info-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:12px auto;max-width:850px}.info-box p{margin:8px 0}.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.contact-item{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center}
footer{margin-top:40px;background:#0f0f0f;color:#bbb;border-top:3px solid var(--gold);padding:28px 0;text-align:center}footer a{color:var(--gold)}.float-wa{position:fixed;bottom:18px;left:18px;background:#25d366;color:#fff;border-radius:50%;width:55px;height:55px;display:grid;place-items:center;font-size:27px;box-shadow:0 4px 15px #0004;z-index:9}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #d9d2bb;border-radius:9px;background:#fff;margin:4px 0 10px;color:#111}label{font-size:13px;font-weight:700;color:#555}textarea{min-height:90px;resize:vertical}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.overlay.open{display:flex}.modal{background:#fff;width:100%;max-width:650px;max-height:92vh;overflow:auto;border-radius:16px;padding:22px;border-top:4px solid var(--gold)}.modal h2{margin:0 0 12px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.close-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.admin-shell{padding:28px 0;min-height:65vh}.admin-panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;margin-bottom:18px}.admin-list{display:grid;gap:10px}.admin-row{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.admin-row .grow{flex:1;min-width:170px}.admin-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.notice{padding:10px 13px;background:#fff6d6;border:1px solid #ead58a;border-radius:9px;margin:10px 0}.status{font-weight:700;margin:8px 0}.hidden{display:none!important}
@media(max-width:850px){nav{gap:9px;font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.trust{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){header .wrap{flex-wrap:wrap;padding-top:8px;padding-bottom:8px}.logo b{font-size:16px}nav{order:3;width:100%;justify-content:space-between;display:flex;font-size:12px}.actions .btn{padding:7px 9px;font-size:12px}.grid{grid-template-columns:1fr 1fr;gap:10px}.product-img{height:145px;font-size:45px}.card-body{padding:10px}.card h3{font-size:16px}.card .price strong{font-size:17px}.card-actions{flex-direction:column}.contact-grid{grid-template-columns:1fr}.modal-grid{grid-template-columns:1fr}.hero{padding:38px 0}.section h2{font-size:24px}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="wrap"><h1>بحر أبيض للتسوق</h1><p>جارٍ تحميل المتجر...</p></div></div></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script>
/* ضع رابط Cloudflare Worker المنشور هنا فقط. لا تضع ADMIN_TOKEN في هذا الملف. */
const API_BASE = "https://bahr-abyad-api.monzir-ali-omer.workers.dev";
const DEFAULT_SETTINGS={name:"بحر أبيض للتسوق",en:"Market B7rabyd",owner:"201100154634",phone:"",email:"",cc:"249",fb:"https://www.facebook.com/bharabidmark",instagram:"",tiktok:"",youtube:"",cur:"ج.س",bar:"🔥 تخفيضات كبرى لفترة محدودة — اطلب الآن عبر الواتساب والتوصيل لباب بيتك!",h1:"بوابة التخفيضات في السودان",sub:"سيارات، مولدات كهربائية، أحذية وملابس ومنتجات متنوعة بأجود المنتجات وأحسن الأسعار.",about:"شركة بحر أبيض للتسويق والإعلان متخصصة في التجارة الإلكترونية، نقدم منتجات متنوعة بأسعار مناسبة وخدمة عملاء عبر الواتساب."};
let settings={...DEFAULT_SETTINGS}, products=[], categories=[], adminToken="", adminTab="products", selectedCategory="الكل";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n||0).toLocaleString("en-US");
const apiReady=()=>API_BASE.startsWith("https://")&&!API_BASE.includes("REPLACE-WITH");
async function api(path,options={}){if(!apiReady())throw Error("أضف رابط Worker الصحيح في أعلى ملف index.html أولًا.");const headers={"Content-Type":"application/json",...(options.headers||{})};if(options.auth&&adminToken)headers.Authorization="Bearer "+adminToken;const r=await fetch(API_BASE+path,{...options,headers});let data={};try{data=await r.json()}catch{}if(!r.ok||data.success===false)throw Error(data.error||("فشل الطلب ("+r.status+")"));return data}
async function init(){try{const [s,p]=await Promise.all([api("/api/settings"),api("/api/products")]);settings={...settings,...s.settings};products=(p.products||[]).map(normalizeProduct);categories=[...new Set(products.map(p=>p.category).filter(Boolean))];}catch(e){console.warn(e)}render();if(!apiReady())alert("المتجر جاهز كملفات، لكن يجب وضع رابط Worker الفعلي في API_BASE قبل ربط قاعدة البيانات.");}
function normalizeProduct(p){return {id:p.id,name:p.name||"منتج",description:p.description||"",price:Number(p.price||0),old_price:Number(p.old_price||0),image_url:p.image_url||"",stock:Number(p.stock??0),condition_type:p.condition_type||"جديد",category:p.category||"عام",is_active:p.is_active??1}}
function go(page){location.hash=page}
function render(){const page=location.hash.replace("#","")||"home";if(page==="admin"){renderAdminGate();return}if(page==="about"){renderAbout();return}if(page==="contact"){renderContact();return}if(page.startsWith("product-")){renderProduct(Number(page.slice(8)));return}renderHome()}
function header(){return `<div class="topbar">${esc(settings.bar)}</div><header><div class="wrap"><a href="#home" class="logo"><span class="logo-icon">🛍️</span><span><b>${esc(settings.name)}</b><small>${esc(settings.en)}</small></span></a><nav><a href="#home">الرئيسية</a><a href="#about">من نحن</a><a href="#contact">اتصل بنا</a></nav><div class="actions"><a class="btn small" target="_blank" rel="noopener" href="${waLink()}">واتساب</a></div></div></header>`}
function footer(){return `<footer><div class="wrap"><b>${esc(settings.name)}</b><p>© ${new Date().getFullYear()} جميع الحقوق محفوظة</p><p><a href="#about">من نحن</a> · <a href="#contact">اتصل بنا</a> · <a href="#admin">الإدارة</a></p></div></footer>${settings.owner?`<a class="float-wa" target="_blank" rel="noopener" href="${waLink()}" aria-label="واتساب">✆</a>`:""}`}
function waLink(message="مرحبًا، أريد الاستفسار عن منتجات بحر أبيض"){return "https://wa.me/"+String(settings.owner||"").replace(/\D/g,"")+"?text="+encodeURIComponent(message)}
function productCard(p){return `<article class="card"><div class="product-img" onclick="go('product-${p.id}')">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none'">`:"🛍️"}</div><div class="card-body"><small class="muted">${esc(p.category)}</small><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description.slice(0,105))}${p.description.length>105?"…":""}</p><div class="price"><strong>${money(p.price)} ${esc(settings.cur)}</strong>${p.old_price>p.price?`<s>${money(p.old_price)}</s>`:""}</div><div class="card-actions"><button class="btn dark" onclick="go('product-${p.id}')">التفاصيل والطلب</button></div></div></article>`}
function renderHome(){const cats=["الكل",...new Set(products.map(p=>p.category).filter(Boolean))];$("#app").innerHTML=header()+`<section class="hero"><div class="wrap"><span class="pill">تسوّق بثقة</span><h1>${esc(settings.h1)}</h1><p>${esc(settings.sub)}</p><a class="btn dark" href="#products">استعرض المنتجات</a></div></section><main class="wrap"><div class="trust"><div>🚚 توصيل حسب الاتفاق</div><div>💬 الطلب عبر الواتساب</div><div>💵 الدفع عند الاستلام حسب التوفر</div><div>🛍️ فئات ومنتجات متنوعة</div></div><section class="section" id="products"><h2>تسوّق حسب <span>الفئة</span></h2><div class="categories">${cats.map(c=>`<button class="category-btn ${c===selectedCategory?"active":""}" onclick="filterCategory('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("")}</div><h2>منتجات <span>المتجر</span></h2><div class="grid">${products.filter(p=>p.is_active!==0&&(selectedCategory==="الكل"||p.category===selectedCategory)).map(productCard).join("")||"<p class='muted'>لا توجد منتجات منشورة حاليًا. أضف المنتجات من لوحة الإدارة.</p>"}</div></section><section class="section"><div class="info-box"><h2>مرحبًا بك في <span>${esc(settings.name)}</span></h2><p>${esc(settings.about)}</p><a class="btn" href="#about">اعرف المزيد عنا</a></div></section></main>`+footer()}
function filterCategory(c){selectedCategory=c;renderHome();document.querySelector("#products")?.scrollIntoView()}
function renderAbout(){$("#app").innerHTML=header()+`<main class="wrap section"><h2>من <span>نحن</span></h2><div class="info-box"><h2>${esc(settings.name)}</h2><p>${esc(settings.about)}</p><p>${esc(settings.sub)}</p><a class="btn" href="#home">تصفح المنتجات</a></div></main>`+footer()}
function renderContact(){$("#app").innerHTML=header()+`<main class="wrap section"><h2>اتصل <span>بنا</span></h2><div class="contact-grid"><div class="contact-item"><h3>واتساب</h3><p>${esc(settings.owner)}</p><a class="btn" target="_blank" rel="noopener" href="${waLink("مرحبًا، أتواصل مع خدمة عملاء بحر أبيض")}">مراسلة خدمة العملاء</a></div><div class="contact-item"><h3>البريد الإلكتروني</h3><p>${esc(settings.email||"أضف البريد من لوحة الإدارة")}</p>${settings.email?`<a class="btn" href="mailto:${esc(settings.email)}">إرسال بريد</a>`:""}</div><div class="contact-item"><h3>فيسبوك</h3><p>تابع جديد المنتجات والعروض</p>${settings.fb?`<a class="btn" target="_blank" rel="noopener" href="${esc(settings.fb)}">زيارة الصفحة</a>`:"غير محدد"}</div></div></main>`+footer()}
function renderProduct(id){const p=products.find(x=>Number(x.id)===id);if(!p){renderHome();return}$("#app").innerHTML=header()+`<main class="wrap section"><a href="#home">← العودة للمنتجات</a><div class="info-box"><div class="modal-grid"><div class="product-img" style="height:300px;cursor:default">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:"🛍️"}</div><div><small class="muted">${esc(p.category)}</small><h2>${esc(p.name)}</h2><p>${esc(p.description)}</p><p>الحالة: ${esc(p.condition_type)}</p><p>المخزون: ${p.stock>0?money(p.stock):"يرجى التأكد من التوفر"}</p><div class="price"><strong>${money(p.price)} ${esc(settings.cur)}</strong>${p.old_price>p.price?`<s>${money(p.old_price)}</s>`:""}</div><button class="btn" onclick="orderForm(${p.id})">طلب هذا المنتج عبر واتساب</button></div></div></div></main>`+footer()}
function openModal(html){$("#modal").innerHTML=html;$("#overlay").classList.add("open")}
function closeModal(){$("#overlay").classList.remove("open")}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal()});
function orderForm(id){const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;openModal(`<div class="close-row"><h2>طلب: ${esc(p.name)}</h2><button class="btn outline small" onclick="closeModal()">إغلاق</button></div><form onsubmit="submitOrder(event,${p.id})"><label>الاسم الكامل *</label><input name="name" required><div class="modal-grid"><div><label>رقم الهاتف *</label><input name="phone" type="tel" required></div><div><label>الكمية *</label><input name="quantity" type="number" min="1" value="1" required></div></div><label>المدينة أو المنطقة *</label><input name="city" required><label>العنوان أو تفاصيل التوصيل</label><textarea name="address"></textarea><label>ملاحظات إضافية</label><textarea name="notes"></textarea><button class="btn" type="submit">متابعة وإرسال الطلب عبر واتساب</button><p class="muted">لن يتم الدفع داخل الموقع؛ يتم تأكيد الطلب والتفاصيل مع خدمة العملاء عبر واتساب.</p></form>`)}
function submitOrder(e,id){e.preventDefault();const p=products.find(x=>Number(x.id)===Number(id));const f=new FormData(e.target);const q=Math.max(1,Number(f.get("quantity")||1));const message=`طلب جديد من متجر ${settings.name}%0Aالمنتج: ${p.name}%0Aالسعر: ${money(p.price)} ${settings.cur}%0Aالكمية: ${q}%0Aالإجمالي التقريبي: ${money(p.price*q)} ${settings.cur}%0Aالاسم: ${f.get("name")}%0Aهاتف العميل: ${f.get("phone")}%0Aالمدينة: ${f.get("city")}%0Aالعنوان: ${f.get("address")||"غير محدد"}%0Aملاحظات: ${f.get("notes")||"لا يوجد"}`;window.open("https://wa.me/"+String(settings.owner).replace(/\D/g,"")+"?text="+encodeURIComponent(message.replace(/%0A/g,"\n")),"_blank","noopener");closeModal()}
function renderAdminGate(){if(adminToken){renderAdmin();return}$("#app").innerHTML=header()+`<main class="wrap admin-shell"><div class="admin-panel" style="max-width:520px;margin:20px auto"><h2>دخول الإدارة</h2><p class="muted">أدخل رمز الإدارة الذي أعددته في Cloudflare كسرّ باسم ADMIN_TOKEN. لا تضع الرمز في ملف الموقع.</p><form onsubmit="adminLogin(event)"><label>رمز الإدارة</label><input id="admin-token" type="password" autocomplete="current-password" required><button class="btn">دخول</button></form><p id="login-status" class="status"></p></div></main>`+footer()}
async function adminLogin(e){e.preventDefault();adminToken=$("#admin-token").value;try{await api("/api/admin/check",{auth:true});sessionStorage.setItem("b7_admin_token",adminToken);renderAdmin()}catch(err){$("#login-status").textContent=err.message;adminToken=""}}
async function renderAdmin(){if(!adminToken)adminToken=sessionStorage.getItem("b7_admin_token")||"";$("#app").innerHTML=header()+`<main class="wrap admin-shell"><div class="close-row"><h1>لوحة إدارة بحر أبيض</h1><button class="btn outline" onclick="adminLogout()">تسجيل الخروج</button></div><div class="admin-tabs"><button class="btn ${adminTab==="products"?"dark":"outline"}" onclick="adminTab='products';renderAdmin()">المنتجات</button><button class="btn ${adminTab==="settings"?"dark":"outline"}" onclick="adminTab='settings';renderAdmin()">إعدادات المتجر</button></div><div id="admin-content"><p>جارٍ تحميل لوحة الإدارة...</p></div></main>`+footer();try{await api("/api/admin/check",{auth:true});if(adminTab==="settings")renderSettingsAdmin();else await renderProductsAdmin()}catch(e){adminToken="";sessionStorage.removeItem("b7_admin_token");renderAdminGate();alert("تعذر التحقق من الإدارة: "+e.message)}}
function adminLogout(){adminToken="";sessionStorage.removeItem("b7_admin_token");renderAdminGate()}
async function renderProductsAdmin(){const data=await api("/api/admin/products",{auth:true});products=(data.products||[]).map(normalizeProduct);categories=data.categories||[];const host=$("#admin-content");if(!host)return;host.innerHTML=`<div class="admin-panel"><button class="btn" onclick="editProduct()">+ إضافة منتج</button><p class="muted">تُحفظ التعديلات في قاعدة بيانات D1.</p></div><div class="admin-list">${products.map(p=>`<div class="admin-row"><div class="grow"><b>${esc(p.name)}</b><br><small class="muted">${esc(p.category)} · ${money(p.price)} ${esc(settings.cur)}</small></div><button class="btn small" onclick="editProduct(${p.id})">تعديل</button><button class="btn red small" onclick="deleteProduct(${p.id})">حذف</button></div>`).join("")||"لا توجد منتجات."}</div>`}
async function editProduct(id){const p=products.find(x=>Number(x.id)===Number(id))||{name:"",description:"",price:"",old_price:"",image_url:"",stock:1,condition_type:"جديد",category:"عام"};openModal(`<h2>${id?"تعديل المنتج":"إضافة منتج"}</h2><form onsubmit="saveProduct(event,${id||0})"><label>اسم المنتج *</label><input name="name" value="${esc(p.name)}" required><label>الفئة *</label><input name="category" value="${esc(p.category)}" list="cat-options" required><datalist id="cat-options">${categories.map(c=>`<option value="${esc(c)}">`).join("")}</datalist><label>الوصف والتفاصيل</label><textarea name="description">${esc(p.description)}</textarea><div class="modal-grid"><div><label>السعر الحالي *</label><input name="price" type="number" min="0" value="${p.price}" required></div><div><label>السعر قبل التخفيض</label><input name="old_price" type="number" min="0" value="${p.old_price||0}"></div><div><label>المخزون</label><input name="stock" type="number" min="0" value="${p.stock??0}"></div><div><label>الحالة</label><select name="condition_type"><option ${p.condition_type==="جديد"?"selected":""}>جديد</option><option ${p.condition_type==="مستعمل"?"selected":""}>مستعمل</option><option ${p.condition_type==="مجدد"?"selected":""}>مجدد</option></select></div></div><label>رابط الصورة (رابط مباشر https)</label><input name="image_url" type="url" value="${esc(p.image_url)}"><label><input style="width:auto" name="is_active" type="checkbox" ${p.is_active!==0?"checked":""}> عرض المنتج في المتجر</label><p><button class="btn">حفظ المنتج في قاعدة البيانات</button> <button type="button" class="btn outline" onclick="closeModal()">إلغاء</button></p></form>`)}
async function saveProduct(e,id){e.preventDefault();const f=new FormData(e.target);const body={name:f.get("name"),category:f.get("category"),description:f.get("description"),price:Number(f.get("price")),old_price:Number(f.get("old_price")||0),stock:Number(f.get("stock")||0),condition_type:f.get("condition_type"),image_url:f.get("image_url"),is_active:f.get("is_active")==="on"?1:0};try{await api(id?"/api/admin/products/"+id:"/api/admin/products",{method:id?"PUT":"POST",auth:true,body:JSON.stringify(body)});closeModal();await renderProductsAdmin();alert("تم حفظ المنتج في قاعدة البيانات.")}catch(err){alert("تعذر الحفظ: "+err.message)}}
async function deleteProduct(id){if(!confirm("هل تريد حذف المنتج؟"))return;try{await api("/api/admin/products/"+id,{method:"DELETE",auth:true});await renderProductsAdmin()}catch(e){alert(e.message)}}
async function renderSettingsAdmin(){const d=await api("/api/settings");settings={...settings,...d.settings};$("#admin-content").innerHTML=`<div class="admin-panel"><h2>إعدادات المتجر والتواصل</h2><form onsubmit="saveSettings(event)"><div class="modal-grid">${field("name","اسم المتجر")}${field("en","الاسم الإنجليزي")}${field("owner","رقم واتساب الدولي بدون +")}${field("phone","رقم الهاتف")}${field("email","بريد خدمة العملاء")}${field("cur","العملة")}${field("fb","رابط فيسبوك")}${field("instagram","رابط إنستغرام")}${field("tiktok","رابط تيك توك")}${field("youtube","رابط يوتيوب")}</div><label>الشريط الإعلاني</label><input name="bar" value="${esc(settings.bar)}"><label>عنوان الصفحة الرئيسية</label><input name="h1" value="${esc(settings.h1)}"><label>الوصف المختصر</label><textarea name="sub">${esc(settings.sub)}</textarea><label>نبذة من نحن</label><textarea name="about">${esc(settings.about)}</textarea><button class="btn">حفظ الإعدادات</button></form></div>`}
function field(k,label){return `<div><label>${label}</label><input name="${k}" value="${esc(settings[k]||"")}"></div>`}
async function saveSettings(e){e.preventDefault();const f=new FormData(e.target);const body={};for(const k of ["name","en","owner","phone","email","cur","fb","instagram","tiktok","youtube","bar","h1","sub","about"])body[k]=String(f.get(k)||"").trim();try{await api("/api/admin/settings",{method:"PUT",auth:true,body:JSON.stringify(body)});settings={...settings,...body};alert("تم حفظ الإعدادات في D1.");renderAdmin()}catch(err){alert("تعذر حفظ الإعدادات: "+err.message)}}
addEventListener("hashchange",()=>{render()});init();
</script>
</body></html>
